
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: npm run dev
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - avatar_uploads:/app/uploads
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: "mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin"
      APP_URL: ${APP_URL:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MAILER_URL: http://mailer:8000
      MAILER_KEY: ${MAILER_KEY:?Set MAILER_KEY in .env (at least 32 characters)}
    depends_on:
      mongo:
        condition: service_healthy
      mailer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Internal email service: no published port, only the backend can reach it.
  mailer:
    build:
      context: ./mailer
      dockerfile: Dockerfile.dev
    volumes:
      - ./mailer:/app
    # SMTP settings live in mailer/.env (see mailer/.env.example). Without it,
    # mail goes to Mailpit. Keep SMTP_* out of `environment:` below: it would
    # override the file.
    env_file:
      - path: ./mailer/.env
        required: false
    environment:
      # Shared with the backend, so it lives in the root .env.
      MAILER_KEY: ${MAILER_KEY:?Set MAILER_KEY in .env (at least 32 characters)}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - mailpit

  # Development inbox: catches every email; web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MongoDB username in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MongoDB password in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-chores}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_INITDB_ROOT_USERNAME}
        - --password
        - ${MONGO_INITDB_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  backend_node_modules:
  mongo_data:
  avatar_uploads:
