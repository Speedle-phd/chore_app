# Optional add-on to compose.prod.yaml when the server already runs nginx on
# ports 80/443 (see DEPLOY.md, "Behind an existing nginx"):
#
#   docker compose -f compose.prod.yaml -f compose.nginx.yaml --env-file .env.production up -d --build
#
# nginx terminates HTTPS and forwards to Caddy on 127.0.0.1:${HEARTH_LOCAL_PORT};
# Caddy serves plain HTTP and gets no certificates.
services:
  web:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.behind-proxy", "--adapter", "caddyfile"]
    # Replace (not add to) the public 80/443 ports: only the host's nginx can reach Caddy.
    ports: !override
      - "127.0.0.1:${HEARTH_LOCAL_PORT:-8080}:80"

  backend:
    environment:
      # Two proxies in front of the backend now: nginx, then Caddy.
      TRUST_PROXY: "2"
