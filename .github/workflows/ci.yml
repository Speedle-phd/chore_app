# CI: the same checks as in development (docs/HANDOFF.md, "Run and test"), on every push to
# main and every pull request. The deploy (added later) only runs when all of these pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never writes to the repo.
permissions:
  contents: read

# A newer push to the same PR cancels the older run. On main every run finishes,
# so each commit's images (and later its deploy) complete in order.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (typecheck, build, unit + integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      # Integration tests need a real MongoDB; each test file uses its own throwaway database.
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26 # same as the production image (backend/Dockerfile)
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26 # same as the production image (frontend/Dockerfile)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npx vite build

  mailer:
    name: Mailer (tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mailer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13' # same as the production image (mailer/Dockerfile)
          cache: pip
          cache-dependency-path: mailer/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Production images on ghcr.io, only for main and only when every check above passed.
  # Tags: the commit SHA (what the deploy uses) and `main` (the newest).
  # The images hold no settings: those come from .env.production on the server at start.
  images:
    name: Image ${{ matrix.image }}
    needs: [backend, frontend, mailer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in token; no secret needed
    strategy:
      matrix:
        include:
          - image: web
            context: frontend
          - image: backend # the worker runs this image too
            context: backend
          - image: mailer
            context: mailer
    steps:
      - uses: actions/checkout@v7
      # Image names must be lowercase (the account is "Speedle-phd").
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hearth-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      # Third-party actions are pinned to a commit (tags can be moved).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:main
          # Links the package to this repo on GitHub.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
