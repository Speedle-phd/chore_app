<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Hearth{% endblock %}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f6f8f6;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#24332e;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e2e8e3;border-radius:16px;">
            <tr>
              <td style="padding:28px 28px 8px;font-size:18px;font-weight:600;color:#477a68;">Hearth</td>
            </tr>
            <tr>
              <td style="padding:8px 28px 28px;font-size:15px;line-height:1.6;">
                {% block content %}{% endblock %}
              </td>
            </tr>
          </table>
          <p style="font-size:12px;color:#68776e;margin-top:16px;">
            You received this email because of activity in your Hearth household.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
